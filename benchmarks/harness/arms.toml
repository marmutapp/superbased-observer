# id = "A-codex-control"
# tool = "codex"
# compression = "off"
# env = ["CODEX_HOME=/tmp/bench-codex-a"]
# exec_flags = ["-s", "workspace-write", "--skip-git-repo-check"]
# salt_bytes = 64
# cache_namespace = "ns-a"
